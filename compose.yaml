name: vititi

services:
  pocketbase:
    build:
      context: .
      dockerfile: docker/pocketbase/Dockerfile
      args:
        PB_VERSION: ${PB_VERSION:-0.41.1}
    restart: unless-stopped
    environment:
      # Optional: creates/updates the dashboard superuser on every start.
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-}
    volumes:
      - pb_data:/pb/pb_data
    # Only reachable by the web container (and not published to the host).
    expose:
      - "8090"

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        # Hardcoded on purpose: "/" = same origin, proxied to PocketBase by nginx.
        # Not read from .env, so a dev VITE_PB_URL there can't leak into the image.
        VITE_PB_URL: "/"
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pb_data:
