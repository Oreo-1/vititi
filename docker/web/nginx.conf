server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Map images can be up to 50 MB (see the maps.image field in pb_schema.json).
  client_max_body_size 100m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Docker's embedded DNS; resolving at request time means nginx still starts
  # (and recovers) if the pocketbase container restarts or is recreated.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # PocketBase REST API, realtime (SSE), file URLs (/api/*) and the admin dashboard (/_/).
  location ~ ^/(api|_)(/|$) {
    set $pocketbase http://pocketbase:8090;
    proxy_pass $pocketbase;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Server-Sent Events (/api/realtime) must not be buffered.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;
  }

  # Hashed build assets can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must always be revalidated so new builds are picked up.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Single-page app fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
